<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="A second HTML page called from index.html that accepts contact information.">
  <meta name="keywords" content="HTML, contacts page">
  <meta name="author" content="Dustin Pulu">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index HTML Page ver.2 Project 4.8</title>

  <link rel="stylesheet" href="styles.css">
  
  <link rel="stylesheet" href="styles-contact.css">
</head>
<body>

  <header>
    <h1>Contact Me</h1>
  </header>

  <main>
   <section class="contact-layout">
    <form id="myForm"
        action="mailto:dustinrpulu@gmail.com"
        method="POST"
        enctype="text/plain">

    <label for="sender">Name</label>
    <input type="text" id="sender" name="sender" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject">

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5"></textarea>

    <input type="submit" value="Send Message">

    </form>

  <button onclick="history.back()">Back</button>
</section>

  </main>

  <footer>
    <p>&copy; 2026 DPulu</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
